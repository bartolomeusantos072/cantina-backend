server {
    listen 80;
    server_name localhost;

    # Frontend Aluno - Usar o GitHub Pages (seu-projeto-aluno.github.io)
    location /aluno {
        proxy_pass https://seu-usuario.github.io/seu-repositorio/aluno/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Cozinheira - Usar o GitHub Pages (seu-projeto-cozinheira.github.io)
    location /cozinheira {
        proxy_pass https://seu-usuario.github.io/seu-repositorio/cozinheira/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy reverso para o backend
    location /api {
        proxy_pass http://backend:3000;  # Encaminha para o backend Node.js
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
